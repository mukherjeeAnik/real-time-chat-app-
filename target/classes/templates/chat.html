<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Chat Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0e0e0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            padding: 2rem;
        }

        .chat-container {
            width: 420px;
            background: #141416;
            border: 0.5px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            overflow: hidden;
        }

        .chat-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 0.5px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            gap: 10px;
            background: #141416;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #1d9e75;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 0 2px rgba(29,158,117,0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 2px rgba(29,158,117,0.2); }
            50% { box-shadow: 0 0 0 5px rgba(29,158,117,0.08); }
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            letter-spacing: 0.02em;
        }

        .header-subtitle {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            font-family: 'DM Mono', monospace;
            margin-left: auto;
        }

        .tag {
            display: inline-block;
            font-size: 10px;
            font-family: 'DM Mono', monospace;
            background: rgba(29,158,117,0.1);
            color: #5dcaa5;
            border: 0.5px solid rgba(29,158,117,0.2);
            border-radius: 4px;
            padding: 1px 6px;
        }

        .chat-messages {
            height: 320px;
            overflow-y: auto;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) transparent;
        }

        .chat-messages::-webkit-scrollbar { width: 3px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

        .msg-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'DM Mono', monospace;
            letter-spacing: -0.02em;
        }

        .msg-group { display: flex; flex-direction: column; max-width: 78%; }
        .msg-outgoing .msg-group { align-items: flex-end; }

        .msg-sender {
            font-size: 10px;
            font-family: 'DM Mono', monospace;
            margin-bottom: 3px;
            opacity: 0.4;
            color: rgba(255,255,255,0.85);
        }

        .msg-incoming .msg-sender { text-align: left; }
        .msg-outgoing .msg-sender { text-align: right; }

        .msg-bubble {
            max-width: 100%;
            padding: 0.55rem 0.85rem;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
            color: rgba(255,255,255,0.85);
        }

        .msg-incoming .msg-avatar { background: #1d3a51; color: #85b7eb; }
        .msg-incoming .msg-bubble {
            background: #1e1e22;
            border: 0.5px solid rgba(255,255,255,0.06);
            border-bottom-left-radius: 4px;
        }

        .msg-outgoing { flex-direction: row-reverse; }
        .msg-outgoing .msg-avatar { background: #0f3024; color: #5dcaa5; }
        .msg-outgoing .msg-bubble {
            background: #1a2e25;
            border: 0.5px solid rgba(29,158,117,0.2);
            border-bottom-right-radius: 4px;
        }

        .chat-inputs {
            padding: 1rem 1.25rem 1.25rem;
            background: #141416;
            border-top: 0.5px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: #1e1e22;
            border: 0.5px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 0.6rem 0.85rem;
            font-size: 13px;
            color: rgba(255,255,255,0.85);
            font-family: 'Syne', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input::placeholder { color: rgba(255,255,255,0.2); }
        .chat-input:focus { border-color: rgba(29,158,117,0.4); }

        .name-input {
            width: 130px;
            flex: none;
            background: #1e1e22;
            border: 0.5px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 0.55rem 0.85rem;
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            font-family: 'DM Mono', monospace;
            outline: none;
            transition: border-color 0.2s;
        }

        .name-input::placeholder { color: rgba(255,255,255,0.18); }
        .name-input:focus { border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.75); }

        .send-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: none;
            background: #1d9e75;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.1s;
        }

        .send-btn:hover { background: #25b585; }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { background: rgba(255,255,255,0.06); cursor: not-allowed; }
        .send-btn svg { width: 16px; height: 16px; stroke: white; fill: none; }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: rgba(255,255,255,0.15);
            font-size: 12px;
            font-family: 'DM Mono', monospace;
            height: 100%;
        }

        .empty-icon { width: 32px; height: 32px; opacity: 0.2; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-animate { animation: slideIn 0.2s ease-out; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="status-dot"></div>
        <span class="header-title">Live Chat</span>
        <span class="header-subtitle">ws://chat &nbsp;<span class="tag">connected</span></span>
    </div>

    <div class="chat-messages" id="chat">
        <div class="empty-state" id="emptyState">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            no messages yet
        </div>
    </div>

    <div class="chat-inputs">
        <div class="input-row">
            <input id="senderInput" class="name-input" type="text" placeholder="your name" maxlength="20">
            <input id="messageInput" class="chat-input" type="text" placeholder="type a message…">
            <button id="sendMessage" class="send-btn">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2" fill="white" stroke="none"/>
                </svg>
            </button>
        </div>
    </div>
</div>

<script>
    var stompClient = null;

    function setConnected(connected) {
        document.getElementById('sendMessage').disabled = !connected;
        var tag = document.querySelector('.tag');
        if (tag) {
            tag.textContent = connected ? 'connected' : 'disconnected';
            tag.style.color = connected ? '#5dcaa5' : '#f09595';
            tag.style.borderColor = connected ? 'rgba(29,158,117,0.2)' : 'rgba(226,75,74,0.2)';
            tag.style.background = connected ? 'rgba(29,158,117,0.1)' : 'rgba(226,75,74,0.1)';
        }
    }

    function getInitials(name) {
        return name.trim().split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase() || '?';
    }

    function connect() {
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, function (frame) {
            setConnected(true);
            stompClient.subscribe('/topic/messages', function (message) {
                showMessage(JSON.parse(message.body));
            });
        }, function () {
            setConnected(false);
        });
    }

    function showMessage(message) {
        var chat = document.getElementById('chat');
        var empty = document.getElementById('emptyState');
        if (empty) empty.remove();

        var myName = document.getElementById('senderInput').value.trim();
        var isOwn = message.sender === myName && myName !== '';

        var wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper msg-animate ' + (isOwn ? 'msg-outgoing' : 'msg-incoming');

        var avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.textContent = getInitials(message.sender || '?');

        var group = document.createElement('div');
        group.className = 'msg-group';

        var senderLabel = document.createElement('div');
        senderLabel.className = 'msg-sender';
        senderLabel.textContent = message.sender || 'anonymous';

        var bubble = document.createElement('div');
        bubble.className = 'msg-bubble';
        bubble.textContent = message.content;

        group.appendChild(senderLabel);
        group.appendChild(bubble);
        wrapper.appendChild(avatar);
        wrapper.appendChild(group);

        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        var sender = document.getElementById('senderInput').value.trim() || 'anonymous';
        var content = document.getElementById('messageInput').value.trim();
        if (!content) return;

        stompClient.send("/app/sendMessage", {}, JSON.stringify({ sender: sender, content: content }));
        document.getElementById('messageInput').value = '';
    }

    document.getElementById('sendMessage').onclick = sendMessage;
    document.getElementById('messageInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') sendMessage();
    });

    window.onload = connect;
</script>

</body>
</html>
